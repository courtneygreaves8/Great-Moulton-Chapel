<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #ebeac7;
      }
      .scene {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 1600px;
        height: 1100px;
        background:
          radial-gradient(ellipse 70% 50% at 40% 40%, #f7f5f0 0%, transparent 60%),
          radial-gradient(ellipse 50% 40% at 80% 70%, #ebd6c8 0%, transparent 55%),
          linear-gradient(160deg, #f3efe6 0%, #ebeac7 45%, #e4dcc8 100%);
      }
      .scene.mobile-scene {
        width: 900px;
        height: 1400px;
        background:
          radial-gradient(ellipse 70% 45% at 50% 35%, #f7f5f0 0%, transparent 60%),
          linear-gradient(180deg, #f3efe6 0%, #ebeac7 50%, #e8dfd0 100%);
      }

      /* Laptop */
      .laptop {
        position: relative;
        width: 1180px;
      }
      .laptop-lid {
        background: #2a2622;
        border-radius: 18px 18px 10px 10px;
        padding: 18px 18px 14px;
        box-shadow:
          0 40px 80px rgba(100, 93, 86, 0.28),
          0 8px 24px rgba(100, 93, 86, 0.18);
      }
      .laptop-camera {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3d3833;
        margin: 0 auto 12px;
      }
      .laptop-screen {
        border-radius: 4px;
        overflow: hidden;
        background: #fff;
        aspect-ratio: 16 / 10;
      }
      .laptop-screen img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
      }
      .laptop-base {
        height: 18px;
        margin: 0 auto;
        width: 1280px;
        max-width: 108%;
        margin-left: -4%;
        background: linear-gradient(180deg, #3a3530 0%, #2a2622 100%);
        border-radius: 0 0 16px 16px;
        box-shadow: 0 18px 40px rgba(100, 93, 86, 0.2);
        position: relative;
      }
      .laptop-notch {
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        width: 140px;
        height: 8px;
        background: #1f1c19;
        border-radius: 0 0 8px 8px;
      }

      /* Phone */
      .phone {
        position: relative;
        width: 360px;
        background: #1f1c19;
        border-radius: 44px;
        padding: 14px;
        box-shadow:
          0 40px 80px rgba(100, 93, 86, 0.3),
          0 8px 24px rgba(100, 93, 86, 0.18),
          inset 0 0 0 2px #3a3530;
      }
      .phone-screen {
        border-radius: 32px;
        overflow: hidden;
        background: #fff;
        aspect-ratio: 9 / 19.5;
        position: relative;
      }
      .phone-screen img {
        display: block;
        width: 100%;
        height: 100%;
        /* Fill the device screen without cropping a wider capture */
        object-fit: fill;
        object-position: top center;
      }
      .phone-island {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 96px;
        height: 28px;
        background: #1f1c19;
        border-radius: 20px;
        z-index: 2;
      }
      .phone-btn {
        position: absolute;
        background: #2a2622;
        border-radius: 2px;
      }
      .phone-btn.silent {
        left: -3px;
        top: 120px;
        width: 3px;
        height: 28px;
      }
      .phone-btn.vol-up {
        left: -3px;
        top: 170px;
        width: 3px;
        height: 52px;
      }
      .phone-btn.vol-down {
        left: -3px;
        top: 232px;
        width: 3px;
        height: 52px;
      }
      .phone-btn.power {
        right: -3px;
        top: 190px;
        width: 3px;
        height: 72px;
      }
    </style>
  </head>
  <body>
    <div id="laptop-scene" class="scene">
      <div class="laptop">
        <div class="laptop-lid">
          <div class="laptop-camera"></div>
          <div class="laptop-screen">
            <img src="./screen-desktop.png" alt="Desktop website" />
          </div>
        </div>
        <div class="laptop-base">
          <div class="laptop-notch"></div>
        </div>
      </div>
    </div>

    <div id="mobile-scene" class="scene mobile-scene">
      <div class="phone">
        <div class="phone-btn silent"></div>
        <div class="phone-btn vol-up"></div>
        <div class="phone-btn vol-down"></div>
        <div class="phone-btn power"></div>
        <div class="phone-screen">
          <div class="phone-island"></div>
          <img src="./screen-mobile.png" alt="Mobile website" />
        </div>
      </div>
    </div>
  </body>
</html>
