<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Bebas+Neue&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Great Moulton Evangelical Chapel — friendly Sunday worship and Wednesday coffee mornings in Great Moulton, Norfolk. All are welcome."
    />
    <title>Great Moulton Chapel</title>
    <style>
      html.boot-loading,
      html.boot-loading body {
        overflow: hidden;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: linear-gradient(
          160deg,
          #c5cec0 0%,
          #f3ebe0 45%,
          #f7f5f0 100%
        );
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader {
          display: none;
        }
        html.boot-loading,
        html.boot-loading body {
          overflow: auto;
        }
      }
    </style>
  </head>
  <body>
    <script>
      document.documentElement.classList.add('boot-loading')
    </script>
    <div id="boot-loader" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
